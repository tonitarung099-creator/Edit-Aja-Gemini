name: P5 Quality Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static / Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: python -m compileall -q tools scripts tests

      - name: Validate repository layout
        run: python -m unittest tests.test_repository_layout -v

      - name: Validate JSON examples
        run: |
          find examples ai-edit/examples -type f -name '*.json' -print0 \
            | xargs -0 -n1 python -m json.tool >/dev/null

  component-tests:
    name: Component / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AI Control
            tests: >-
              tests.test_ai_edit
              tests.test_ai_edit_compose
              tests.test_asset_manifest
              tests.test_capability_registry
              tests.test_creator_pipeline
              tests.test_film_context
              tests.test_film_context_native_patch
              tests.test_local_edit_agent
              tests.test_local_edit_native_patch
              tests.test_local_edit_scene_undo_patch
              tests.test_local_edit_preview_history_patch
              tests.test_keyframe_api_compile_fix
              tests.test_phase_integration
              tests.test_workflow_presets

          - name: Media Editorial
            tests: >-
              tests.test_media_intelligence
              tests.test_dialogue_intelligence
              tests.test_bad_take_review
              tests.test_beat_sync
              tests.test_rhythm_intelligence
              tests.test_smart_montage
              tests.test_highlight_intelligence
              tests.test_broll_planner

          - name: Audio Speech
            tests: >-
              tests.test_audio_intelligence
              tests.test_auto_ducking
              tests.test_deepfilternet
              tests.test_demucs_backend
              tests.test_whispercpp

          - name: Captions
            tests: >-
              tests.test_caption_intelligence
              tests.test_animated_captions
              tests.test_speaker_captions

          - name: Visual Segmentation
            tests: >-
              tests.test_visual_intelligence
              tests.test_sam2_adapter
              tests.test_mask_effects

          - name: Documentary
            tests: >-
              tests.test_documentary_toolkit
              tests.test_documentary_graphics
              tests.test_motion_graphics_templates

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run component tests
        run: python -m unittest ${{ matrix.tests }} -v

  contract-smoke:
    name: Contracts / Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate bundled AI Edit examples
        run: |
          python tools/ai_edit/update_p5_ai_edit.py validate ai-edit/examples/documentary-basic.json
          python tools/ai_edit/update_p5_ai_edit.py validate ai-edit/examples/chatgpt-portable.json

      - name: Validate capability registry CLI
        shell: bash
        run: |
          set +e
          python tools/capability_registry/capability_registry.py --json >/tmp/capabilities.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
          test -s /tmp/capabilities.json

      - name: Validate creator pipeline dry run
        run: |
          python tools/creator_pipeline/creator_pipeline.py \
            examples/creator/documentary-pipeline.json \
            --dry-run \
            --workdir /tmp/update-p5-pipeline

      - name: Validate Film Context tool catalog
        run: |
          python tools/film_context/film_context.py tool-catalog > /tmp/film-context-tools.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/film-context-tools.json').read_text(encoding='utf-8'))
          names = {tool['name'] for tool in data['tools']}
          expected = {
              'movie_context_status',
              'movie_search',
              'movie_get_scene',
              'movie_get_context',
              'movie_get_keyframes',
          }
          if names != expected:
              raise SystemExit(f'Unexpected Film Context tool catalog: {sorted(names)}')
          PY

      - name: Validate workflow preset generation
        run: |
          python tools/workflow_presets/workflow_presets.py documentary \
            --transcript transcript.json \
            --rhythm rhythm.json \
            --output /tmp/pipeline.json
          test -s /tmp/pipeline.json

  build-configuration:
    name: Build / Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile build helper Python
        run: python -m compileall -q scripts tests/test_build_configuration.py tests/test_build_manifest.py

      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3

      - name: Test build configuration and pinned manifest
        run: |
          python -m unittest discover -s tests -p 'test_build*.py' -v
          python -m unittest tests.test_packaging_images -v

      - name: Parse workflow YAML and collect PowerShell scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          scripts = []

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              workflow = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
              for job in workflow.get('jobs', {}).values():
                  for step in job.get('steps', []):
                      if step.get('shell') == 'pwsh' and 'run' in step:
                          scripts.append({
                              'name': f'{path}: {step["name"]}',
                              'script': step['run'],
                          })

          for path in sorted(Path('scripts/windows').glob('*.ps1')):
              scripts.append({
                  'name': str(path),
                  'script': path.read_text(encoding='utf-8'),
              })

          Path('workflow-scripts.json').write_text(
              json.dumps(scripts),
              encoding='utf-8',
          )
          print(f'Collected {len(scripts)} PowerShell scripts for syntax validation.')
          PY

      - name: Parse PowerShell syntax without executing build commands
        shell: pwsh
        run: |
          $scripts = Get-Content workflow-scripts.json -Raw | ConvertFrom-Json
          foreach ($entry in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput(
              $entry.script,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "$($entry.name): $($errors | Out-String)"
            }
          }
          Write-Host "Validated $($scripts.Count) PowerShell scripts."

  packaging-preflight:
    name: Build / Windows Packaging Preflight
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test packaging preflight and real Windows junctions
        run: python -m unittest tests.test_packaging_images -v
      - name: Test smoke diagnostics and process exit detection
        shell: pwsh
        run: ./tests/test_smoke_support.ps1
      - name: Read pinned Craft revision for integration tests
        id: craft-test-revision
        shell: pwsh
        run: |
          $manifest = Get-Content build/build-manifest.json -Raw | ConvertFrom-Json
          "revision=$($manifest.craft.revision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: KDE/craft
          ref: ${{ steps.craft-test-revision.outputs.revision }}
          path: .craft-preflight-fixture/craft
          persist-credentials: false
      - name: Test preflight CLI with actual pinned Craft
        env:
          P5_CRAFT_TEST_SOURCE: .craft-preflight-fixture/craft
        run: python -m unittest tests.test_craft_preflight_integration -v

  source-reconstruction:
    name: Source / Reconstruction
    needs: build-configuration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct and verify pinned P5 source
        run: python scripts/reconstruct_source.py --output corresponding-source
